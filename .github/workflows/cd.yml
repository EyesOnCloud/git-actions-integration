name: CD Pipeline - Trigger Jenkins

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  trigger-jenkins-deployment:
    runs-on: ubuntu-latest
    name: Trigger Jenkins Deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get commit information
        id: commit
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT

      - name: Trigger Jenkins Build
        run: |
          curl -X POST \
            http://${{ secrets.JENKINS_HOST }}:8080/job/github-actions-deploy/build \
            --user ${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }} \
            -F token=${{ secrets.JENKINS_BUILD_TOKEN }} \
            -F cause="Triggered by GitHub Actions"

      - name: Deployment notification
        run: |
          echo "Jenkins deployment job has been triggered"
          echo "Commit SHA: ${{ steps.commit.outputs.sha }}"
          echo "Author: ${{ steps.commit.outputs.author }}"
